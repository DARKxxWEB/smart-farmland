name: smart-farmland

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - "$${MONGO_INITDB_ROOT_USERNAME}"
        - --password
        - "$${MONGO_INITDB_ROOT_PASSWORD}"
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: apps/auth-service/Dockerfile
    environment:
      SQLALCHEMY_DATABASE_URL: ${SQLALCHEMY_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      GRPC_REFLECTION: "false"
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; c=grpc.insecure_channel('127.0.0.1:50051'); health_pb2_grpc.HealthStub(c).Check(health_pb2.HealthCheckRequest(), timeout=2); c.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  telemetry-service:
    build:
      context: ./services/telemetry-service
      dockerfile: apps/telemetry-service/Dockerfile
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: telemetry
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50052
      GRPC_REFLECTION: "false"
    ports:
      - "127.0.0.1:50052:50052"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; c=grpc.insecure_channel('127.0.0.1:50052'); health_pb2_grpc.HealthStub(c).Check(health_pb2.HealthCheckRequest(), timeout=2); c.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  bi-service:
    build:
      context: ./services/bi-service
      dockerfile: apps/bi-service/Dockerfile
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: bi
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50053
      GRPC_REFLECTION: "false"
      TELEMETRY_GRPC_TARGET: telemetry-service:50052
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED}
      AVALAI_API_KEY: ${AVALAI_API_KEY}
      AVALAI_BASE_URL: ${AVALAI_BASE_URL}
      AVALAI_MODEL: ${AVALAI_MODEL}
    ports:
      - "127.0.0.1:50053:50053"
    depends_on:
      mongo:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; c=grpc.insecure_channel('127.0.0.1:50053'); health_pb2_grpc.HealthStub(c).Check(health_pb2.HealthCheckRequest(), timeout=2); c.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: apps/notification-service/Dockerfile
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: notifications
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50054
      GRPC_REFLECTION: "false"
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_FILE:+/run/secrets/firebase-service-account.json}
    volumes:
      - ${FIREBASE_CREDENTIALS_FILE:-/dev/null}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:50054:50054"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; c=grpc.insecure_channel('127.0.0.1:50054'); health_pb2_grpc.HealthStub(c).Check(health_pb2.HealthCheckRequest(), timeout=2); c.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: ./services/api-gateway
      dockerfile: apps/gateway/Dockerfile
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8000
      AUTH_GRPC_TARGET: auth-service:50051
      TELEMETRY_GRPC_TARGET: telemetry-service:50052
      BI_GRPC_TARGET: bi-service:50053
      NOTIFICATION_GRPC_TARGET: notification-service:50054
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEVICE_INGEST_TOKEN: ${DEVICE_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      bi-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sample-data-importer:
    build:
      context: ./services/api-gateway
      dockerfile: apps/gateway/Dockerfile
    command:
      - python
      - /app/tools/fake-data/import.py
      - --file
      - /app/tools/fake-data/sample-readings.csv
      - --shift-to-now
      - --batch-size
      - "500"
      - --marker-file
      - /state/sample-data-imported
    environment:
      GATEWAY_URL: http://gateway:8000
      IMPORT_USERNAME: ${ADMIN_USERNAME}
      IMPORT_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - sample_data_import_state:/state
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_GATEWAY_URL: http://gateway:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
      sample-data-importer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
  postgres_data:
  sample_data_import_state:
