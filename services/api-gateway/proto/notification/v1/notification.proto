syntax = "proto3";

package notification.v1;

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (DeviceResponse);
  rpc RemoveDevice(RemoveDeviceRequest) returns (DeviceResponse);
  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkRead(MarkReadRequest) returns (Notification);
}

message RegisterDeviceRequest {
  string user_id = 1;
  string token = 2;
}

message RemoveDeviceRequest {
  string user_id = 1;
  string token = 2;
}

message DeviceResponse {
  bool registered = 1;
}

message CreateNotificationRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  map<string, string> data = 4;
  string source_id = 5;
}

message CreateNotificationResponse {
  Notification notification = 1;
  bool duplicate = 2;
  int32 sent_count = 3;
  int32 failed_count = 4;
}

message ListNotificationsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  bool unread_only = 4;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_page_token = 2;
  int64 unread_count = 3;
}

message MarkReadRequest {
  string user_id = 1;
  string notification_id = 2;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string body = 4;
  map<string, string> data = 5;
  string delivery_status = 6;
  int32 sent_count = 7;
  int32 failed_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp read_at = 10;
}
